version: 2

models:
  - name: company_overview_analystrating
    description: Analyst rating counts and consensus target price per ticker
    tests:
      - min_row_count:
          min_rows: 400
    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
          - not_empty_string
      - name: analyst_target_price
        description: Consensus analyst price target
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: analyst_rating_strong_buy
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: analyst_rating_buy
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: analyst_rating_hold
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: analyst_rating_sell
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: analyst_rating_strong_sell
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: company_overview_nonfinancial
    description: Non-financial company attributes — sector, industry, geography
    tests:
      - min_row_count:
          min_rows: 400
    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
          - not_empty_string
      - name: company_name
        description: Full legal company name
        tests:
          - not_null
          - not_empty_string
      - name: sector
        description: GICS sector classification
        tests:
          - not_null
          - not_empty_string
      - name: industry
        description: Industry sub-classification
        tests:
          - not_null
          - not_empty_string
      - name: country
        description: Country of headquarters
        tests:
          - not_null
          - not_empty_string
      - name: currency
        description: Trading currency
        tests:
          - not_null
          - accepted_values:
              values: ['USD', 'CAD', 'EUR', 'GBP', 'HKD', 'JPY', 'AUD']
              config:
                severity: warn
      - name: fiscal_year_end
        description: Month in which the company's fiscal year ends
        tests:
          - not_null
          - accepted_values:
              values: ['January', 'February', 'March', 'April', 'May', 'June',
                       'July', 'August', 'September', 'October', 'November', 'December']

  - name: company_overview_valuation
    description: Valuation multiples and capital structure metrics per ticker
    tests:
      - min_row_count:
          min_rows: 400
      - column_gte_column:
          column_a: shares_outstanding
          column_b: shares_float
    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
          - not_empty_string
      - name: market_capitalization
        description: Total market capitalization in USD
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: shares_outstanding
        description: Total shares outstanding
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: shares_float
        description: Publicly tradable float shares (must not exceed shares outstanding)
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: diluted_eps_ttm
        description: Diluted EPS on trailing twelve months
        tests:
          - dbt_utils.accepted_range:
              min_value: -1000
              max_value: 10000
              config:
                severity: warn
      - name: pe_ratio
        description: Price-to-earnings ratio
        tests:
          - dbt_utils.accepted_range:
              min_value: -500
              max_value: 5000
              config:
                severity: warn
      - name: trailing_pe
        tests:
          - dbt_utils.accepted_range:
              min_value: -500
              max_value: 5000
              config:
                severity: warn
      - name: forward_pe
        tests:
          - dbt_utils.accepted_range:
              min_value: -500
              max_value: 5000
              config:
                severity: warn
      - name: peg_ratio
        tests:
          - dbt_utils.accepted_range:
              min_value: -100
              max_value: 100
              config:
                severity: warn
      - name: price_to_book_ratio
        tests:
          - dbt_utils.accepted_range:
              min_value: -50
              max_value: 500
              config:
                severity: warn
      - name: revenue_ttm
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: ebitda
        description: EBITDA; may be negative for unprofitable companies
        tests:
          - dbt_utils.accepted_range:
              min_value: -1000000000000
              max_value: 1000000000000
              config:
                severity: warn
      - name: ev_to_ebitda
        tests:
          - dbt_utils.accepted_range:
              min_value: -100
              max_value: 1000
              config:
                severity: warn
      - name: ev_to_revenue
        tests:
          - dbt_utils.accepted_range:
              min_value: -10
              max_value: 500
              config:
                severity: warn
      - name: beta
        description: Market beta; 1.0 = moves in line with market
        tests:
          - dbt_utils.accepted_range:
              min_value: -10
              max_value: 20
              config:
                severity: warn

  - name: stock_performance_with_indicators
    description: >
      Daily stock prices joined with company fundamentals and industry-level
      economic leading indicators. Grain is ticker + date + indicator_name.
    tests:
      - min_row_count:
          min_rows: 400
      - ohlc_integrity:
          high_col: high
          low_col: low
          open_col: open
          close_col: close
      - no_future_date:
          column_name: date
      - no_weekend_date:
          column_name: date
    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
          - not_empty_string
      - name: date
        description: Trading date
        tests:
          - not_null
      - name: open
        description: Opening price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: high
        description: Intraday high price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: low
        description: Intraday low price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: close
        description: Closing price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: adjusted_close
        description: Closing price adjusted for splits and dividends
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: volume
        description: Shares traded
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: company_name
        description: Full legal company name
        tests:
          - not_null
      - name: sector
        description: GICS sector
        tests:
          - not_null
      - name: exchange
        tests:
          - not_null
      - name: beta
        tests:
          - dbt_utils.accepted_range:
              min_value: -10
              max_value: 20
              config:
                severity: warn
      - name: pe_ratio
        tests:
          - dbt_utils.accepted_range:
              min_value: -500
              max_value: 5000
              config:
                severity: warn
      - name: market_capitalization
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: percent_insiders
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: percent_institutions
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: indicator_value
        description: Numeric value of the economic indicator on this date
        tests:
          - dbt_utils.accepted_range:
              min_value: -1000000
              max_value: 1000000
              config:
                severity: warn

  - name: industry_indicators_descriptions
    description: >
      Economic indicator metadata joined with time series values.
      Grain is indicator name + date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - name
            - date
      - min_row_count:
          min_rows: 100
      - no_future_date:
          column_name: date
    columns:
      - name: name
        description: Indicator name
        tests:
          - not_null
          - not_empty_string
      - name: classification
        description: Leading, lagging, or coincident
        tests:
          - not_null
          - not_empty_string
      - name: units
        description: Unit of measurement
        tests:
          - not_null
      - name: industrylist
        description: Comma-separated list of applicable industries
        tests:
          - not_null
          - not_empty_string
      - name: value
        description: Observed indicator value
        tests:
          - not_null
      - name: date
        description: Observation date
        tests:
          - not_null

  - name: int_industry_mapping
    description: >
      Cleaned mapping from company industry labels (AlphaVantage)
      to indicator industry labels (economic data). Each company industry
      maps to exactly one indicator industry.
    tests:
      - min_row_count:
          min_rows: 1
    columns:
      - name: company_industry
        description: Uppercased company industry label from AlphaVantage
        tests:
          - not_null
          - unique
          - not_empty_string
      - name: indicator_industry
        description: Corresponding indicator industry label
        tests:
          - not_null
          - not_empty_string

  - name: int_trading_calendar
    description: >
      Every expected NYSE trading day from 2020-01-01 through the most recent
      completed trading day (yesterday, or last Friday if today is Monday).
      Weekends and US market holidays (seed: us_market_holidays) are excluded.
      Used as the date spine in mart_data_gaps.
    tests:
      - min_row_count:
          min_rows: 1000
    columns:
      - name: trading_date
        description: A valid NYSE trading day
        tests:
          - not_null
          - unique

  - name: int_stock_price_features
    description: >
      Daily price-derived features for each ticker at (ticker, date) grain.
      All returns use adjusted_close to account for splits and dividends.
      Window functions require sufficient history: RSI needs 14 days, 200-day MA
      needs 200 days, and 6-month return needs 126 days before values are non-null.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, date]
      - min_row_count:
          min_rows: 400
    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
          - not_empty_string
      - name: date
        description: Trading date
        tests:
          - not_null
      - name: daily_return
        description: Percentage return from the prior trading day's adjusted close
      - name: return_1m
        description: 21-trading-day backward-looking return
      - name: return_3m
        description: 63-trading-day backward-looking return
      - name: return_6m
        description: 126-trading-day backward-looking return
      - name: ma_20d
        description: 20-day simple moving average of adjusted close
      - name: ma_50d
        description: 50-day simple moving average of adjusted close
      - name: ma_200d
        description: 200-day simple moving average of adjusted close
      - name: bollinger_pct_b
        description: >
          Bollinger Band %B: (price - 20d MA) / (2 * 20d stddev).
          0.5 = midline, >1 = above upper band, <0 = below lower band.
      - name: price_to_ma_20d
        description: Ratio of adjusted close to 20-day MA; >1 means price is above the average
      - name: price_to_ma_50d
        description: Ratio of adjusted close to 50-day MA
      - name: price_to_ma_200d
        description: Ratio of adjusted close to 200-day MA
      - name: volatility_20d
        description: 20-day rolling standard deviation of daily returns (realized volatility)
      - name: volatility_60d
        description: 60-day rolling standard deviation of daily returns
      - name: volume_ratio_20d
        description: Today's volume divided by 20-day average volume; >1 = above-average activity
      - name: rsi_14
        description: >
          14-period Relative Strength Index using a simple moving average approximation.
          Below 30 = oversold signal, above 70 = overbought signal.

  - name: int_forward_returns
    description: >
      Forward return targets at 1, 3, 6, 9, and 12-month horizons per (ticker, date).
      These are the ML target labels for the retirement stock-picking model.
      Use has_3m_target = true to filter to rows with a complete 3-month forward window.
      Longer horizons (6m, 9m, 12m) will be null for more recent rows.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ticker, date]
      - min_row_count:
          min_rows: 400
    columns:
      - name: ticker
        tests:
          - not_null
          - not_empty_string
      - name: date
        tests:
          - not_null
      - name: forward_return_1m
        description: >
          (adjusted_close 21 trading days later / adjusted_close today) - 1.
          Null for the most recent ~21 trading days.
      - name: forward_return_3m
        description: >
          Primary ML target: (adjusted_close 63 trading days later / adjusted_close today) - 1.
          Null for the most recent ~63 trading days.
      - name: forward_return_6m
        description: >
          (adjusted_close 126 trading days later / adjusted_close today) - 1.
          Null for the most recent ~6 months.
      - name: forward_return_9m
        description: >
          (adjusted_close 189 trading days later / adjusted_close today) - 1.
          Null for the most recent ~9 months.
      - name: forward_return_12m
        description: >
          (adjusted_close 252 trading days later / adjusted_close today) - 1.
          Null for the most recent ~12 months.
      - name: has_1m_target
        description: True when a complete 1-month forward window exists.
      - name: has_3m_target
        description: True when a complete 3-month forward window exists.
      - name: has_6m_target
        description: True when a complete 6-month forward window exists.
      - name: has_9m_target
        description: True when a complete 9-month forward window exists.
      - name: has_12m_target
        description: True when a complete 12-month forward window exists.

  - name: int_yield_curve
    description: >
      US Treasury yield curve pivoted wide, forward-filled to every NYSE trading day,
      with derived spread signals and rate-of-change metrics.
      Fixed income asset class boundary: only refs fixed income staging models.
      Cross-asset joins (to equities) happen exclusively at mart layer.
      Grain: one row per trading date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date]
      - min_row_count:
          min_rows: 1000
    columns:
      - name: date
        tests: [not_null, unique]
      - name: yield_3m
        description: 3-month Treasury yield (%)
      - name: yield_2y
        description: 2-year Treasury yield (%)
      - name: yield_5y
        description: 5-year Treasury yield (%)
      - name: yield_7y
        description: 7-year Treasury yield (%)
      - name: yield_10y
        description: 10-year Treasury yield (%) — benchmark risk-free rate
      - name: yield_30y
        description: 30-year Treasury yield (%)
      - name: fed_funds_rate
        description: Effective federal funds rate (%)
      - name: spread_2s10s
        description: 10y minus 2y yield (pp); negative = inverted curve = elevated recession risk
        tests:
          - dbt_utils.accepted_range:
              min_value: -5
              max_value: 10
              config:
                severity: warn
      - name: spread_3m10y
        description: 10y minus 3m yield (pp); Fed's preferred inversion metric
      - name: spread_2s30s
        description: 30y minus 2y yield (pp); long-end demand signal
      - name: term_premium
        description: 10y yield minus fed funds rate (pp); duration risk compensation
      - name: is_2s10s_inverted
        description: True when 2s10s spread is negative
      - name: is_3m10y_inverted
        description: True when 3m10y spread is negative
      - name: yield_10y_1d_chg_bps
        description: 1-day change in 10y yield in basis points
      - name: yield_10y_5d_chg_bps
        description: 5-day change in 10y yield in basis points
      - name: yield_2y_1d_chg_bps
        description: 1-day change in 2y yield in basis points
      - name: cpi_value
        description: CPI index value (forward-filled from monthly release)
      - name: cpi_yoy_pct
        description: Year-over-year CPI change (%), approximated using 252-day lag

  - name: int_macro_signals
    description: >
      Daily macro and risk signals pivoted wide and forward-filled to every NYSE trading day.
      Sources: FRED API (VIX, crude oil, inflation breakeven, HY credit spread).
      Forward-fill ensures no null gaps in the ML feature matrix.
      Grain: one row per trading_date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [date]
      - min_row_count:
          min_rows: 1000
    columns:
      - name: date
        description: NYSE trading date
        tests:
          - not_null
          - unique
      - name: vix
        description: CBOE Volatility Index — market fear gauge; >30 signals elevated risk
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 200
              config:
                severity: warn
      - name: oil_price_wti
        description: WTI crude oil spot price in USD/barrel
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 500
              config:
                severity: warn
      - name: oil_price_brent
        description: Brent crude oil spot price in USD/barrel
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 500
              config:
                severity: warn
      - name: inflation_breakeven_10y
        description: 10-year breakeven inflation rate (%) — market inflation expectations
        tests:
          - dbt_utils.accepted_range:
              min_value: -5
              max_value: 15
              config:
                severity: warn
      - name: hy_credit_spread
        description: ICE BofA US HY option-adjusted spread (%) — credit stress indicator; spikes during crises
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 50
              config:
                severity: warn

  - name: int_analyst_signals
    description: >
      Derived analyst consensus and ownership signals per ticker.
      Ticker grain — snapshot from the latest company overview load.
      Join to int_stock_price_features on ticker to use as ML features.
    tests:
      - min_row_count:
          min_rows: 400
    columns:
      - name: ticker
        tests:
          - not_null
          - unique
          - not_empty_string
      - name: net_bullish_score
        description: >
          Weighted analyst consensus normalized to [-2, +2].
          Strong buy = +2, buy = +1, sell = -1, strong sell = -2, hold = 0.
          Positive values = net bullish; null if no ratings exist.
      - name: analyst_upside
        description: >
          (analyst_target_price / latest_close) - 1.
          How far analysts expect the price to move from the current level.
      - name: total_aligned_ownership_pct
        description: percent_insiders + percent_institutions; high values suggest alignment with long-term holders

  - name: int_economic_signals
    description: >
      Industry-level economic leading indicator signals aggregated to (indicator_industry, date) grain.
      Resolves the fan-out grain problem in stock_performance_with_indicators, which produces one row
      per (ticker, date, indicator_name). This model collapses to one row per (indicator_industry, date)
      for clean joining to the price spine. Economic data is typically monthly, so trading-day joins
      will produce nulls on non-reporting dates — forward-fill in downstream ML preprocessing.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [indicator_industry, date]
      - min_row_count:
          min_rows: 10
    columns:
      - name: indicator_industry
        description: Economic industry label (from Snowflake Marketplace data)
        tests:
          - not_null
          - not_empty_string
      - name: date
        description: Observation date for this set of indicator values
        tests:
          - not_null
      - name: indicator_count
        description: Number of distinct indicators contributing to this industry-date row
      - name: economic_activity_index
        description: Simple average across all applicable economic indicators for this industry and date
      - name: avg_leading_value
        description: Average value of leading indicators (predict future economic direction)
      - name: avg_coincident_value
        description: Average value of coincident indicators (reflect current economic state)
      - name: avg_lagging_value
        description: Average value of lagging indicators (confirm past economic trends)
