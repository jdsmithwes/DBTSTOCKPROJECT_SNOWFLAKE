dbt_stockproject:
  # Default target is 'snowflake' (runs inside Snowflake Workspace / DBT PROJECT).
  # For local development, override with: dbt run --target dev --profiles-dir .
  target: snowflake

  outputs:

    # ── Local development ──────────────────────────────────────────────────────
    # Key-pair auth — no password, works regardless of Snowflake IP network policy.
    # Private key lives on this machine at SNOWFLAKE_PRIVATE_KEY_PATH.
    # Run: set -a && source .env && set +a && dbt run --target dev --profiles-dir .
    dev:
      type: snowflake
      account:           "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user:              "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path:  "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role:              "{{ env_var('SNOWFLAKE_ROLE',      'DBT_ROLE') }}"
      database:          "{{ env_var('SNOWFLAKE_DATABASE',  'DBT_STOCKPROJECT') }}"
      warehouse:         "{{ env_var('SNOWFLAKE_WAREHOUSE', 'DBT_STOCKPROJECT') }}"
      schema:            "{{ env_var('SNOWFLAKE_SCHEMA',    'DBT_DEV_JDS_STAGING') }}"
      threads: 8

    # ── Production ────────────────────────────────────────────────────────────
    # Same key-pair auth as dev; schema resolves to production aliases.
    # Run: DBT_TARGET=prod dbt run --full-refresh --select mart_ml_features --profiles-dir .
    prod:
      type: snowflake
      account:           "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user:              "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path:  "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role:              "{{ env_var('SNOWFLAKE_ROLE',      'DBT_ROLE') }}"
      database:          "{{ env_var('SNOWFLAKE_DATABASE',  'DBT_STOCKPROJECT') }}"
      warehouse:         "{{ env_var('SNOWFLAKE_WAREHOUSE', 'DBT_STOCKPROJECT') }}"
      schema:            "JDS_STAGING"
      threads: 8

    # ── Inside Snowflake (Workspace / DBT PROJECT / Task) ─────────────────────
    # No env_var() calls — auth is handled by the Snowflake session automatically.
    snowflake:
      type: snowflake
      account: TPRFGUJ-JNC76647
      user: jdsmithwes
      role: DBT_ROLE
      database: DBT_STOCKPROJECT
      warehouse: DBT_STOCKPROJECT
      schema: JDS_STAGING
      threads: 8
