dbt_stockproject:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: DBT_ROLE
      database: DBT_STOCKPROJECT
      warehouse: DBT_STOCKPROJECT
      schema: DBT_DEV_JDS_STAGING
      threads: 8
